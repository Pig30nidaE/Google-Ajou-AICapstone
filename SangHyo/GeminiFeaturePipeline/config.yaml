# GeminiFeaturePipeline default configuration.
# Every value below can also be set with a GFP_* environment variable or a CLI flag.
# CLI > environment > this file > dataclass default (see config.py).

run:
  experiment_name: GeminiFeaturePipeline
  run_id: null            # null -> UTC timestamp, one new directory per run
  seed: 20260729
  n_jobs: 1
  subject_hash_salt: GeminiFeaturePipeline

paths:
  data_root: null         # null -> base.ipynb DATA_ROOT, else <repo>/Data
  output_root: null       # null -> /content/drive/MyDrive/<experiment>_result on Colab
  cache_root: null        # null -> /content/drive/MyDrive/<experiment>_cache (persists across runs)

data:
  splits: [train]         # 'val' is intentionally NOT evaluated at this stage (AGENTS.md 2-5)
  positive_diagnoses: [MCI, Dem]
  negative_diagnoses: [CN]
  min_days_per_subject: 28
  strict_cohort_contract: true
  expected_subjects:
    train: 141
    val: 33

gemini:
  enabled: true
  model: gemini-2.5-flash
  api_key_env: GEMINI_API_KEY   # only the NAME of the variable; never the key itself
  temperature: 0.0
  top_p: 0.95
  max_output_tokens: 2048
  response_seed: 7
  timeout_seconds: 120
  max_retries: 6
  initial_backoff_seconds: 2.0
  backoff_multiplier: 2.0
  max_backoff_seconds: 90.0
  # Sized for a free-tier key (observed limit: 5 req/min for gemini-2.5-flash
  # generate_content). Sequential calls 13s apart stay under that with margin.
  # Raise both if your key is on a paid tier with a higher quota.
  max_concurrency: 1
  min_interval_seconds: 13.0
  dry_run: false
  offline: false
  retry_failed: false
  limit_subjects: null
  repeat_calls: 1               # >1 only for an explicit stability check
  price_per_million_input_tokens: null   # optional, for cost estimation only
  price_per_million_output_tokens: null

payload:
  round_digits: 4
  max_series_points: 24
  weekly_summary: true
  hourly_profile: true
  series_channels:
    - act_steps
    - act_average_met
    - act_high_minutes
    - act_inactive_minutes
    - slp_total_minutes
    - slp_efficiency
    - slp_awake_minutes
    - slp_midsleep_hour

features:
  base_channels:
    - act_steps
    - act_average_met
    - act_daily_movement
    - act_high_minutes
    - act_medium_minutes
    - act_inactive_minutes
    - act_intraday_relative_amplitude
    - act_intraday_transition_rate
    - slp_total_minutes
    - slp_efficiency
    - slp_awake_minutes
    - slp_deep_ratio
    - slp_rem_ratio
    - slp_restless
    - slp_hr_average
    - slp_onset_latency_minutes
  base_stats: [mean, sd]
  include_clock_regularity: true
  feature_sets: [base, base_gemini]
  mmse_item_max: 2.0        # fixed by the scoring scheme (1=incorrect, 2=correct); not data-derived

cv:
  n_splits: 5
  n_repeats: 5
  min_positive_per_validation_fold: 2

models:
  enabled: [logreg, gbdt]
  logreg:
    C: 1.0
    max_iter: 2000
    penalty: l2
  gbdt:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 7
    min_child_samples: 15
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0

tuning:
  enabled: false            # must stay false at this stage
  n_trials: 10

mmse_mode: both             # without | with | both
