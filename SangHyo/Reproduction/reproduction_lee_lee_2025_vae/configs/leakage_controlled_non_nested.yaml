defaults: base.yaml

# ══════════════════════════════════════════════════════════════════════════════
# 실험 B — leakage_controlled_non_nested
#
# 논문 하이퍼파라미터를 **고정**한 채 피험자 분리와 전처리·VAE 범위만 통제한다.
# 하이퍼파라미터를 다시 선택하지 않는다 (search.enabled=false를 config 검증이 강제).
#
# 강제 순서:
#   1. 피험자 ID 기준 fold 분리
#   2. 이상치 처리기 fit ← train 피험자만
#   3. imputer fit       ← train 피험자만
#   4. scaler fit        ← train 피험자의 실제 행만
#   5. VAE fit           ← train fold의 실제 Dem 기록만
#   6. 합성행은 train에만
#   7. 분류기 학습
#   8. 평가 피험자에는 학습된 변환만 적용
#   9. 평가 피험자에 합성행 절대 미추가
# ══════════════════════════════════════════════════════════════════════════════

label: B_leakage_controlled
experiment:
  name: leakage_controlled_non_nested
  description: >
    피험자 테이블 층화 3-fold. 실험 A와 동일한 Isolation Forest·VAE 설정을
    유지하되, 독립 평가 피험자의 행은 삭제하지 않고 split 및 fit 범위를 통제.

split:
  unit: subject
  method: subject_stratified       # 174명 subject table을 층화
  n_splits: 3                      # Dem 12명 → eval fold마다 정확히 4명
  n_repeats: 1                     # 1~10 설정 가능
  # 일별 행에 StratifiedGroupKFold를 적용하면 Dem이 3/6/3명으로 갈렸던
  # 2026-08-03 결과를 피하기 위해 피험자 1행 테이블을 직접 층화한다.

preprocessing:
  fit_scope: train_fold_only
  scaler_scope: train_real_only    # 합성 4,000행이 통계량을 지배하지 않도록 (B-4)

outlier:
  method: isolation_forest         # A5와 같은 알고리즘; fit 범위만 train fold로 제한
  isolation_forest:
    contamination: 0.1
    n_estimators: 100
    max_samples: auto

augmentation:
  method: vae
  vae:
    latent_dim: 500                # 논문 §5.1 본문값 고정 (재선택하지 않는다)
    ratio_to_real: 9.71            # [유도] I-5. fold마다 실제 Dem 행 수가 다르므로
                                   #        절대 개수(4,000)가 아니라 배수로 환산한다
    n_synthetic: null
    fit_scope: train_dem_only      # 감사기가 강제
    input_space: scaled            # 4자릿수 스케일 차이 때문 (D-5)

audit:
  mode: enforce                    # 위반 시 즉시 LeakageError

bootstrap:
  enabled: true
  n_boot: 2000

diagnostics:
  enabled: true

search:
  enabled: false                   # 실험 B에서는 어떤 선택도 하지 않는다
