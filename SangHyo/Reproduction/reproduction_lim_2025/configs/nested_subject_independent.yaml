# 실험 C — nested_subject_independent
#
# 목적: 모델 선택과 최종 평가를 분리한 상태에서 신규 피험자에 대한 일반화 성능을
#       추정한다.
#
# outer test는 모델 선택·변수 선택·임계값 선택에 절대 사용되지 않는다.
# 이 규칙은 src/audit/leakage.py의 check_outer_test_isolation이 강제한다.
#
# 실행 시간 주의: outer 5 × repeats 3 × inner 3 × 후보 2~3개 × 모델 5개다.
# 딥러닝 3종이 포함되면 GPU에서도 길어질 수 있다. 먼저 models를
# [random_forest, xgboost]로 줄여 한 번 돌려보고 시간을 재는 것을 권한다.

experiment: nested_subject_independent
analysis: main_lifelog_only
seed: 42

data:
  join_mode: positional
  sleep_date_source: bedtime_end

features:
  feature_set: paper_code_verbatim
  include_cognitive_tests: false
  drop_zero_variance: true
  drop_administrative: true

split:
  mode: nested_stratified_group_kfold
  outer_k: 5
  inner_k: 3
  repeats: 3

models:
  - random_forest
  - xgboost
  - lstm
  - bilstm
  - cnn1d

representations:
  random_forest: tabular_subject_aggregate
  xgboost: tabular_subject_aggregate
  lstm: temporal_sequence
  bilstm: temporal_sequence
  cnn1d: temporal_sequence

representation_options:
  sequence_length: max
  padding: pre
  truncation: last
  gap_handling: compress
  min_observations: 1

preprocessing:
  scaler_scope: train_only
  standardize_tree_models: false

tuning:
  # inner CV 안에서만 동작하는 작은 사전 정의 탐색공간이다.
  # 공간 정의는 src/models/registry.py의 INNER_SEARCH_SPACES에 있고
  # 모델당 후보가 2~3개뿐이다. Optuna나 대규모 grid는 사용하지 않는다.
  enabled: true

threshold:
  # inner CV에서만 선택한다. outer test 라벨은 임계값 결정에 쓰이지 않는다.
  policy: inner_cv
  objective: balanced_accuracy

training:
  loss: bce
  optimizer: adam
  learning_rate: 0.001
  batch_size: 16
  max_epochs: 60          # nested는 fit 횟수가 많아 예산을 줄인다
  early_stopping: true
  early_stopping_metric: auc
  early_stopping_patience: 8
  validation_fraction: 0.2
  pos_weight: null

evaluation:
  pooling: mean
  sensitivity_pooling: true

checkpointing:
  save_models: false
